[package]
name = "clifford-net"
version = "0.1.0"
description = "Minimal multi-node weight sync for Clifford models"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clifford-nn = { path = "../clifford-nn" }
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
